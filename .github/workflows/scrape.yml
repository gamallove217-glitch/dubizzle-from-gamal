name: Update Direct Owner Ads

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dubizzle-scraper-group
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clean Sentry bug from scraper.py
        run: |
          python3 -c '
          with open("scraper.py", "r", encoding="utf-8") as f:
              lines = f.readlines()
          cleaned = [l for l in lines if "sentry" not in l.lower()]
          with open("scraper.py", "w", encoding="utf-8") as f:
              f.writelines(cleaned)
          '
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper.py
          git commit -m "Remove sentry lines from scraper.py" || true
          git push origin main || true

      - name: Install all dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install curl_cffi requests beautifulsoup4 lxml sentry-sdk

      - name: Run Original Dubizzle Scraper
        env:
          PAGES_PER_CATEGORY: "5"
          MAX_RUNTIME_SECONDS: "600"
        run: python -u scraper.py || true

      - name: Run Original Extra Radar
        run: python -u extra_radar.py || true

      - name: Commit and push updated ads
        if: always()
        run: |
          git pull --rebase origin main || true
          git add ads.json
          if git diff --staged --quiet; then
            echo "No changes in ads.json"
          else
            git commit -m "Auto-update direct owner ads" || true
            git push origin main || true
          fi
