name: Scrape Dubizzle Hourly

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scraper.py'
      - '.github/workflows/scrape.yml'

concurrency:
  group: dubizzle-continuous-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml curl_cffi

      - name: Continuous 15-Minute Scraper Loop
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 16); do
            echo "=========================================="
            echo "Starting Cycle $i of 16 at $(date)"
            echo "=========================================="

            git fetch origin main || true
            git reset --hard origin/main || true

            python scraper.py || true

            git add ads.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update ads.json (Cycle $i)"
              git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main) || true
            fi

            if [ "$i" -lt 16 ]; then
              echo "Cycle $i finished. Sleeping 15 minutes until next cycle..."
              sleep 900
            fi
          done
