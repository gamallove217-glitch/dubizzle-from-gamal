name: Update Direct Owner Ads

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dubizzle-scraper-group
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect and Restore Original Engine
        run: |
          echo "=== ORIGINAL REQUIREMENTS ==="
          git show 1953ca8fa75d52b69593262bf806934bc8d0b66d:requirements.txt || true
          echo "=== ORIGINAL WORKFLOW ==="
          git show 1953ca8fa75d52b69593262bf806934bc8d0b66d:.github/workflows/scrape.yml || true
          git checkout 1953ca8fa75d52b69593262bf806934bc8d0b66d -- scraper.py extra_radar.py requirements.txt
          sed -i '/http/d' requirements.txt
          echo "=== CLEANED REQUIREMENTS ==="
          cat requirements.txt

      - name: Install all original dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install curl_cffi requests
          if grep -qi playwright requirements.txt; then
            playwright install chromium --with-deps || true
          fi

      - name: Run Original Dubizzle Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u scraper.py

      - name: Run Original Extra Radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u extra_radar.py

      - name: Commit and push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ads.json requirements.txt scraper.py extra_radar.py
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git pull --rebase origin main || true
            git add ads.json requirements.txt scraper.py extra_radar.py
            git commit -m "Restore original engine and update direct owner ads" || true
            git push origin main || true
          fi
