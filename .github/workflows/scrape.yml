name: Update Direct Owner Ads

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dubizzle-scraper-group
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Cloudflare WARP Proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp xvfb
          warp-cli --accept-tos registration new || warp-cli --accept-tos register || true
          warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy || true
          warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000 || true
          warp-cli --accept-tos connect || true
          sleep 4
          curl -s -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E "ip=|warp=" || true

      - name: Install Python and Browser Dependencies
        run: |
          pip install --upgrade pip
          pip install curl_cffi requests beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      - name: Run Dubizzle Scraper
        env:
          PAGES_PER_CATEGORY: "2"
          MAX_RUNTIME_SECONDS: "600"
        run: xvfb-run -a python -u scraper.py

      - name: Run Extra Radar (Aqarmap and OpenSooq and AI Brain)
        run: xvfb-run -a python -u extra_radar.py

      - name: Commit and push updated ads
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ads.json
          if git diff --staged --quiet; then
            echo "No changes in ads.json"
          else
            git pull --rebase origin main || true
            git add ads.json
            git commit -m "Auto-update direct owner ads" || true
            git push origin main || true
          fi
