name: Scrape Dubizzle 4 Times Daily

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4 requests

      - name: Run scraper
        run: python scraper.py

      - name: Save updated ads and blocklist
        run: |
          git config user.name "Auto Scraper"
          git config user.email "actions@github.com"
          git add ads.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update owner ads and purge >7d" && git push)
