name: Scrape Dubizzle Hourly

on:
  schedule:
    - cron: '15 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install curl_cffi beautifulsoup4 lxml requests

      - name: Run scraper
        run: |
          python scraper.py

      - name: Commit and Push updated ads.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ads.json
          git diff --staged --quiet || git commit -m "Auto-update New Cairo owner ads"
          git pull --rebase -X theirs origin main || true
          git push origin main
