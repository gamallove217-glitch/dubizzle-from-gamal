name: Update Direct Owner Ads

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dubizzle-scraper-group
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect and Restore Original Engine Automatically
        run: |
          echo "=== LAST 10 COMMITS ==="
          git log -n 10 --oneline
          PREV_S=$(git log -n 2 --format="%H" -- scraper.py | tail -n 1)
          PREV_E=$(git log -n 2 --format="%H" -- extra_radar.py | tail -n 1)
          PREV_Y=$(git log -n 6 --format="%H" -- .github/workflows/scrape.yml | tail -n 1)
          echo "Restoring scraper.py from: $PREV_S"
          echo "Restoring extra_radar.py from: $PREV_E"
          git checkout "$PREV_S" -- scraper.py || true
          git checkout "$PREV_E" -- extra_radar.py || true
          git show "$PREV_Y":.github/workflows/scrape.yml > old_workflow.txt || true
          sed -i '/http/d' requirements.txt || true
          echo "=== CLEANED REQUIREMENTS ==="
          cat requirements.txt || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper.py extra_radar.py requirements.txt old_workflow.txt
          git commit -m "Restore original engine files to main" || true
          git push origin main || true

      - name: Install all original dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install curl_cffi requests beautifulsoup4
          if grep -qi playwright requirements.txt; then
            playwright install chromium --with-deps || true
          fi

      - name: Run Original Dubizzle Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u scraper.py || true

      - name: Run Original Extra Radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u extra_radar.py || true

      - name: Commit and push updated ads
        if: always()
        run: |
          git pull --rebase origin main || true
          git add ads.json
          if git diff --staged --quiet; then
            echo "No changes in ads.json"
          else
            git commit -m "Auto-update direct owner ads" || true
            git push origin main || true
          fi
