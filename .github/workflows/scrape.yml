name: Scrape Dubizzle Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scraper.py'
      - 'extra_radar.py'
      - '.github/workflows/scrape.yml'

concurrency:
  group: dubizzle-continuous-loop
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write

jobs:
  radar_matrix_loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        step_phase: [
          "1_dubizzle", "1_extra",
          "2_dubizzle", "2_extra",
          "3_dubizzle", "3_extra",
          "4_dubizzle", "4_extra"
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml curl_cffi

      - name: Execute Independent Radar Phase (${{ matrix.step_phase }})
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main || true
          git reset --hard origin/main || true

          PHASE="${{ matrix.step_phase }}"
          echo "=========================================="
          echo "Running Phase: $PHASE on Fresh Server IP"
          echo "=========================================="

          if [[ "$PHASE" == *"_dubizzle" ]]; then
            python scraper.py | tee dubizzle_run.log || true
            python -c '
          import json, os
          if os.path.exists("ads.json") and os.path.exists("dubizzle_run.log"):
              with open("ads.json", "r", encoding="utf-8") as f: d = json.load(f)
              with open("dubizzle_run.log", "r", encoding="utf-8", errors="ignore") as f: log_txt = f.read()[-15000:]
              if d.get("ads"): d["ads"][0]["_dub_log"] = log_txt
              with open("ads.json", "w", encoding="utf-8") as f: json.dump(d, f, ensure_ascii=False, indent=2)
          ' || true
          else
            python -c '
          import json, os
          if os.path.exists("ads.json"):
              with open("ads.json", "r", encoding="utf-8") as f: d = json.load(f)
              for a in d.get("ads", []):
                  if "_dub_log" in a:
                      with open("dubizzle_run.log", "w", encoding="utf-8") as lf: lf.write(a.pop("_dub_log"))
                      break
              with open("ads.json", "w", encoding="utf-8") as f: json.dump(d, f, ensure_ascii=False, indent=2)
          ' || true
            python extra_radar.py || true
          fi

          git add ads.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update ads.json ($PHASE)"
            git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main) || true
          fi

          if [[ "$PHASE" == *"_extra" ]] && [[ "$PHASE" != "4_extra" ]]; then
            echo "Phase $PHASE complete. Sleeping 5 minutes before next cycle..."
            sleep 300
          fi
