name: Update Direct Owner Ads

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dubizzle-scraper-group
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Pre-Sentry Original Files
        run: |
          echo "=== COMMITS BEFORE 4284d86 ==="
          git log 4284d86 -n 5 --oneline
          git checkout 4284d86~1 -- scraper.py || git checkout 4284d86 -- scraper.py
          git checkout f783904~1 -- extra_radar.py || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper.py extra_radar.py
          git commit -m "Restore pre-sentry original scraper and extra_radar" || true
          git push origin main || true

      - name: Install all dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install curl_cffi requests beautifulsoup4 lxml sentry-sdk google-generativeai

      - name: Run Original Dubizzle Scraper
        run: python -u scraper.py || true

      - name: Run Original Extra Radar
        run: python -u extra_radar.py || true

      - name: Commit and push updated ads
        if: always()
        run: |
          git pull --rebase origin main || true
          git add ads.json
          if git diff --staged --quiet; then
            echo "No changes in ads.json"
          else
            git commit -m "Auto-update direct owner ads" || true
            git push origin main || true
          fi
