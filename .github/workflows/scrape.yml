name: Scrape Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: radar-scraping
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run_radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml curl_cffi

      - name: Run Dubizzle Scraper
        run: python scraper.py | tee dubizzle_run.log || true

      - name: Wait 3 minutes to avoid IP Ban
        run: sleep 180

      - name: Run Aqarmap & OpenSooq
        run: python extra_radar.py || true

      - name: Commit and Push Data Once
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ads.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Radar Data"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
