name: Scrape Dubizzle 6 Times Daily

on:
  schedule:
    - cron: '5 0,7,11,15,18,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml curl_cffi duckduckgo-search

      - name: Run scraper
        run: python scraper.py

      - name: Commit and Push updated ads.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add ads.json
          git diff --staged --quiet || git commit -m "Auto-update New Cairo owner ads"
          git push origin main
