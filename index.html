<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>رادار مصيدة الملاك VIP | بوابة المشتركين</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#07090e; --card:#0f131d; --surface:#131824; --border:rgba(255,255,255,0.08); --gold-border:rgba(212,175,55,0.38); --gold:#d4af37; --gold-dark:#aa820a; --text:#f8fafc; --muted:#94a3b8; --green:#10b981; --red:#ef4444; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Cairo',sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5; }
    #login-gate { position:fixed; inset:0; background:var(--bg); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px; }
    .login-box { width:100%; max-width:420px; background:var(--card); border:1px solid var(--gold-border); border-radius:16px; padding:30px 22px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.85); }
    .login-input { width:100%; padding:13px 15px; background:var(--surface); border:1px solid var(--border); border-radius:12px; color:var(--text); font-size:15px; font-weight:800; text-align:center; outline:none; margin:14px 0; direction:ltr; }
    .login-input:focus { border-color:var(--gold); }
    .login-btn { width:100%; padding:13px; background:linear-gradient(135deg, var(--gold), var(--gold-dark)); color:#000; font-size:15px; font-weight:900; border:none; border-radius:12px; cursor:pointer; }
    .login-err { color:var(--red); font-size:13px; font-weight:700; margin-top:12px; display:none; }
    .app-container { max-width:1280px; margin:0 auto; padding:16px 14px 60px; display:none; }
    .top-bar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; background:var(--card); border:1px solid var(--gold-border); border-radius:16px; padding:15px 18px; margin-bottom:16px; }
    .kpi-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:16px; }
    @media(max-width:768px){ .kpi-grid { grid-template-columns:repeat(2, 1fr); } }
    .kpi-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:13px; cursor:pointer; }
    .kpi-card.active { border-color:var(--gold); background:rgba(212,175,55,0.1); }
    .kpi-label { font-size:12px; color:var(--muted); font-weight:700; display:block; }
    .kpi-val { font-size:22px; font-weight:900; color:var(--gold); }
    .filters-panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px; margin-bottom:16px; }
    .search-sort-row { display:grid; grid-template-columns:1fr 210px 190px; gap:10px; margin-bottom:12px; }
    @media(max-width:820px){ .search-sort-row { grid-template-columns:1fr; } }
    .ctrl { width:100%; padding:10px 13px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; font-weight:700; outline:none; }
    .chips-scroll { display:flex; gap:7px; overflow-x:auto; padding-bottom:7px; margin-bottom:8px; scrollbar-width:none; }
    .chips-scroll::-webkit-scrollbar { display:none; }
    .chip { white-space:nowrap; padding:6px 13px; border-radius:50px; font-size:12px; font-weight:800; background:var(--surface); color:var(--muted); border:1px solid var(--border); cursor:pointer; }
    .chip.active { background:var(--gold); color:#000; border-color:var(--gold); }
    .ads-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:15px; }
    @media(max-width:480px){ .ads-grid { grid-template-columns:1fr; } }
    .ad-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:17px; display:flex; flex-direction:column; justify-content:space-between; }
    .ad-card.contacted-card { border-color:rgba(16,185,129,0.45); }
    .badge { padding:3px 9px; border-radius:6px; font-size:11px; font-weight:800; display:inline-block; margin-left:4px; }
    .price-banner { background:var(--surface); border:1px solid var(--gold-border); border-radius:12px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; margin:10px 0; }
    .ad-desc { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:12px; color:var(--muted); margin:10px 0; max-height:85px; overflow-y:auto; }
    .card-actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:10px; }
    .btn-card { padding:9px 11px; border-radius:8px; font-size:12px; font-weight:800; text-align:center; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text); text-decoration:none; }
    .btn-card.primary { background:linear-gradient(135deg, var(--gold), var(--gold-dark)); color:#000; border:none; }
    .btn-card.full { grid-column:span 2; }
    .btn-card.done { background:rgba(16,185,129,0.18); color:var(--green); border-color:var(--green); }
  </style>
</head>
<body>

  <div id="login-gate">
    <div class="login-box">
      <h2 style="color:var(--gold);margin-bottom:6px;">رادار مصيدة الملاك VIP</h2>
      <p style="font-size:12.5px;color:var(--muted);">أدخل كود الاشتراك الفردي الخاص بك (صالح لجهاز واحد فقط ويحظر تلقائيا عند المشاركة)</p>
      <input type="text" id="sub-code-inp" class="login-input" placeholder="VIP-XXXX-XXXX" />
      <button class="login-btn" onclick="activateAndLogin()">تفعيل الاشتراك والدخول</button>
      <p id="login-err" class="login-err"></p>
    </div>
  </div>

  <div id="app-container" class="app-container">
    <header class="top-bar">
      <div>
        <h3 id="sub-welcome" style="color:var(--gold);">مصيدة الملاك VIP</h3>
        <small id="sub-meta" style="color:var(--muted);"></small>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-card" onclick="fetchProtectedAds()">تحديث البيانات</button>
        <button class="btn-card" style="color:var(--red);border-color:rgba(239,68,68,0.35);" onclick="logoutBroker()">تسجيل الخروج</button>
      </div>
    </header>

    <section class="kpi-grid">
      <div class="kpi-card active" id="kpi-ALL" onclick="setSource('ALL')">
        <span class="kpi-label">إجمالي الملاك</span>
        <span class="kpi-val" id="cnt-ALL">0</span>
      </div>
      <div class="kpi-card" id="kpi-دوبيزل" onclick="setSource('دوبيزل')">
        <span class="kpi-label">ملاك دوبيزل</span>
        <span class="kpi-val" id="cnt-دوبيزل">0</span>
      </div>
      <div class="kpi-card" id="kpi-عقارماب" onclick="setSource('عقارماب')">
        <span class="kpi-label">ملاك عقارماب</span>
        <span class="kpi-val" id="cnt-عقارماب">0</span>
      </div>
      <div class="kpi-card" id="kpi-السوق المفتوح" onclick="setSource('السوق المفتوح')">
        <span class="kpi-label">ملاك السوق المفتوح</span>
        <span class="kpi-val" id="cnt-السوق المفتوح">0</span>
      </div>
    </section>

    <section class="filters-panel">
      <div class="search-sort-row">
        <input type="text" id="q-inp" class="ctrl" placeholder="ابحث بالحي (اللوتس، النرجس، الياسمين، البنفسج...) أو اسم المالك" oninput="renderCards()" />
        <select id="crm-sel" class="ctrl" onchange="renderCards()">
          <option value="ALL">المتابعة الشخصية: الكل</option>
          <option value="UNCONTACTED">لم أتواصل معه بعد</option>
          <option value="CONTACTED">تم التواصل معه</option>
        </select>
        <select id="sort-sel" class="ctrl" onchange="renderCards()">
          <option value="NEWEST">الأحدث أولا</option>
          <option value="PRICE_ASC">السعر: الأقل أولا</option>
          <option value="PRICE_DESC">السعر: الأعلى أولا</option>
        </select>
      </div>

      <div class="chips-scroll" id="cat-chips">
        <button class="chip active" data-val="ALL" onclick="setCat('ALL')">الكل</button>
        <button class="chip" data-val="شقق للبيع" onclick="setCat('شقق للبيع')">شقق للبيع</button>
        <button class="chip" data-val="شقق للإيجار" onclick="setCat('شقق للإيجار')">شقق للإيجار</button>
        <button class="chip" data-val="فلل للبيع" onclick="setCat('فلل للبيع')">فلل للبيع</button>
        <button class="chip" data-val="فلل للإيجار" onclick="setCat('فلل للإيجار')">فلل للإيجار</button>
        <button class="chip" data-val="عقار تجاري للبيع" onclick="setCat('عقار تجاري للبيع')">عقار تجاري للبيع</button>
        <button class="chip" data-val="عقار تجاري للإيجار" onclick="setCat('عقار تجاري للإيجار')">عقار تجاري للإيجار</button>
        <button class="chip" data-val="مبانى و أراضى" onclick="setCat('مبانى و أراضى')">مبانى و أراضى</button>
      </div>
    </section>

    <div id="ads-grid" class="ads-grid"></div>
  </div>

  <script>
    let allAds = [];
    let selectedSrc = "ALL";
    let selectedCat = "ALL";
    let contactedMap = JSON.parse(localStorage.getItem("broker_contacted_v1") || "{}");

    async function getHardwareFingerprint() {
      const raw = [
        navigator.userAgent,
        navigator.language,
        screen.colorDepth,
        screen.width + "x" + screen.height,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || 0,
        navigator.platform || ""
      ].join("||");
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function activateAndLogin() {
      const code = document.getElementById("sub-code-inp").value.trim();
      const errEl = document.getElementById("login-err");
      errEl.style.display = "none";
      if (!code) return;

      const hwHash = await getHardwareFingerprint();
      const res = await fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, hwHash })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        errEl.textContent = data.error || "تعذر تفعيل الكود";
        errEl.style.display = "block";
        return;
      }
      fetchProtectedAds();
    }

    async function fetchProtectedAds() {
      const hwHash = await getHardwareFingerprint();
      const res = await fetch("/api/data", {
        method: "GET",
        headers: { "x-hw-hash": hwHash }
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        document.getElementById("app-container").style.display = "none";
        document.getElementById("login-gate").style.display = "flex";
        if (errData.error && res.status === 403) {
          const errEl = document.getElementById("login-err");
          errEl.textContent = errData.error;
          errEl.style.display = "block";
        }
        return;
      }

      const data = await res.json();
      allAds = data.ads || [];
      document.getElementById("login-gate").style.display = "none";
      document.getElementById("app-container").style.display = "block";

      const expDate = new Date(data.expiresAt).toLocaleDateString("ar-EG");
      document.getElementById("sub-welcome").textContent = `مشترك: ${data.brokerName}`;
      document.getElementById("sub-meta").textContent = `صالح حتى: ${expDate} | آخر تحديث: ${data.last_scrape}`;

      document.getElementById("cnt-ALL").textContent = allAds.length;
      document.getElementById("cnt-دوبيزل").textContent = allAds.filter(a => a.source === "دوبيزل").length;
      document.getElementById("cnt-عقارماب").textContent = allAds.filter(a => a.source === "عقارماب").length;
      document.getElementById("cnt-السوق المفتوح").textContent = allAds.filter(a => a.source === "السوق المفتوح").length;

      renderCards();
    }

    function setSource(src) {
      selectedSrc = src;
      document.querySelectorAll(".kpi-card").forEach(el => el.classList.remove("active"));
      const el = document.getElementById("kpi-" + src);
      if (el) el.classList.add("active");
      renderCards();
    }

    function setCat(cat) {
      selectedCat = cat;
      document.querySelectorAll("#cat-chips .chip").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-val") === cat);
      });
      renderCards();
    }

    function toggleContact(adId) {
      if (contactedMap[adId]) delete contactedMap[adId];
      else contactedMap[adId] = true;
      localStorage.setItem("broker_contacted_v1", JSON.stringify(contactedMap));
      renderCards();
    }

    function renderCards() {
      const q = document.getElementById("q-inp").value.trim().toLowerCase();
      const crm = document.getElementById("crm-sel").value;
      const sort = document.getElementById("sort-sel").value;

      let list = allAds.filter(a => {
        if (selectedSrc !== "ALL" && a.source !== selectedSrc) return false;
        if (selectedCat !== "ALL" && a.category !== selectedCat) return false;
        const isDone = !!contactedMap[a.ad_id];
        if (crm === "UNCONTACTED" && isDone) return false;
        if (crm === "CONTACTED" && !isDone) return false;
        if (q && !`${a.title} ${a.description} ${a.seller_name}`.toLowerCase().includes(q)) return false;
        return true;
      });

      if (sort === "PRICE_ASC") list.sort((a, b) => (a.price_num || 999999999) - (b.price_num || 999999999));
      else if (sort === "PRICE_DESC") list.sort((a, b) => (b.price_num || 0) - (a.price_num || 0));

      const grid = document.getElementById("ads-grid");
      grid.innerHTML = list.map(a => {
        const isDone = !!contactedMap[a.ad_id];
        return `
          <article class="ad-card ${isDone ? 'contacted-card' : ''}">
            <div>
              <div>
                <span class="badge" style="background:rgba(212,175,55,0.15);color:var(--gold);">${a.source}</span>
                <span class="badge" style="background:rgba(59,130,246,0.15);color:#93c5fd;">${a.category}</span>
                <span class="badge" style="background:rgba(139,92,246,0.15);color:#c4b5fd;">${a.subtype || 'وحدة'}</span>
              </div>
              <div class="price-banner">
                <strong style="font-size:18px;color:var(--gold);">${a.price_text}</strong>
                <small style="color:var(--muted);">${a.area || ''}</small>
              </div>
              <h4 style="font-size:14.5px;margin-bottom:6px;">${a.title}</h4>
              <div class="ad-desc">${a.description || ''}</div>
            </div>
            <div>
              <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);">
                <span>المالك: ${a.seller_name || 'المالك'}</span>
                <span>#${a.ad_id}</span>
              </div>
              <div class="card-actions">
                <a href="${a.url}" target="_blank" rel="noopener" class="btn-card primary">فتح الإعلان</a>
                <a href="${a.url}" target="_blank" rel="noopener" class="btn-card">الرقم بالإعلان</a>
                <button class="btn-card full ${isDone ? 'done' : ''}" onclick="toggleContact(${a.ad_id})">
                  ${isDone ? 'تم التواصل مع المالك' : 'تحديد كـ: تم التواصل مع المالك'}
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    async function logoutBroker() {
      await fetch("/api/auth", { method: "DELETE" });
      location.reload();
    }

    fetchProtectedAds();
    setInterval(fetchProtectedAds, 60000);
  </script>
</body>
</html>
