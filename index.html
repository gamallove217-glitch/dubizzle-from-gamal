<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>مصيدة الملاك</title>
<style>
:root{--bg:#0b1120;--card:#151f32;--border:#263554;--gold:#eab308;--text:#f8fafc;--muted:#94a3b8;--green:#10b981;--blue:#3b82f6;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);padding:16px;max-width:1150px;margin:0 auto}
#lockScreen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:380px;text-align:center}
.lock-box h2{color:var(--gold);margin-bottom:8px;font-size:1.4rem}
.lock-box p{color:var(--muted);font-size:.88rem;margin-bottom:18px}
.lock-box input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0f172a;color:#fff;text-align:center;font-size:1.05rem;margin-bottom:12px}
.lock-box button{width:100%;padding:12px;border-radius:10px;border:none;background:var(--gold);color:#000;font-weight:800;font-size:1rem;cursor:pointer}
.err-msg{color:var(--red);font-size:.82rem;margin-top:8px;display:none}
header{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem}
h1{font-size:1.35rem;color:var(--gold)}
.sub{color:var(--muted);font-size:.82rem;margin-top:2px}
.sync-badge{background:#064e3b;color:#6ee7b7;border:1px solid #047857;padding:6px 12px;border-radius:99px;font-size:.8rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat .num{font-size:1.55rem;font-weight:900;color:var(--gold)}
.stat .lbl{font-size:.8rem;color:var(--muted);margin-top:4px}
.filters-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.filter-group-title{font-size:.78rem;color:var(--gold);font-weight:700;margin-bottom:4px}
.tabs-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab-btn{background:#0f172a;color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:10px;font-size:.84rem;font-weight:700;cursor:pointer;white-space:nowrap}
.tab-btn.active{background:var(--gold);color:#000;border-color:var(--gold)}
.controls-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
input,select{background:#0f172a;color:var(--text);border:1px solid var(--border);padding:10px 12px;border-radius:10px;font-size:.88rem;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;position:relative}
.card.opened{border-color:#475569;opacity:.88}
.card.contacted{border-color:var(--green)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.b-cat{background:#1e3a8a;color:#93c5fd;padding:4px 10px;border-radius:8px;font-size:.75rem;font-weight:700}
.b-sub{background:#312e81;color:#c7d2fe;padding:4px 10px;border-radius:8px;font-size:.75rem;font-weight:700}
.b-own{background:#065f46;color:#6ee7b7;padding:4px 10px;border-radius:8px;font-size:.75rem;font-weight:700}
.b-state{background:#334155;color:#cbd5e1;padding:4px 8px;border-radius:8px;font-size:.72rem;font-weight:700}
.b-state.done{background:#064e3b;color:#6ee7b7}
.price{font-size:1.3rem;font-weight:900;color:var(--gold)}
.title{font-size:.98rem;font-weight:700;line-height:1.45}
.specs{display:flex;gap:10px;color:var(--muted);font-size:.82rem;flex-wrap:wrap;background:#0f172a;padding:8px 10px;border-radius:8px}
.desc{color:#cbd5e1;font-size:.83rem;line-height:1.55;max-height:95px;overflow-y:auto;background:#0f172a;padding:10px;border-radius:8px}
.seller{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:10px;border-radius:10px;border:none;font-weight:800;font-size:.84rem;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn-open{background:var(--gold);color:#000}
.btn-wa{background:var(--green);color:#000}
.btn-contact-toggle{grid-column:span 2;background:#1e293b;color:var(--text);border:1px solid var(--border);padding:8px;font-size:.8rem}
.btn-contact-toggle.active{background:#065f46;color:#6ee7b7;border-color:#059669}
.empty{text-align:center;padding:40px;color:var(--muted);background:var(--card);border-radius:16px;border:1px solid var(--border)}
#visitorModal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9998;display:none;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <h2>مصيدة الملاك</h2>
    <p>أدخل اسمك وكود المرور للدخول للنظام</p>
    <input type="text" id="vName" placeholder="اسمك بالكامل">
    <input type="password" id="vPass" placeholder="كود المرور">
    <button onclick="unlock()">دخول</button>
    <div class="err-msg" id="errMsg">كود المرور غير صحيح</div>
  </div>
</div>

<div id="visitorModal" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-box">
    <h3 style="color:var(--gold);margin-bottom:12px">سجل الزوار والأجهزة (خاص بالأدمن)</h3>
    <div id="visitorList" style="font-size:.85rem;color:var(--text);display:flex;flex-direction:column;gap:8px"></div>
    <button onclick="document.getElementById('visitorModal').style.display='none'" style="margin-top:14px;width:100%;padding:10px;border-radius:8px;border:none;background:var(--gold);color:#000;font-weight:800">إغلاق</button>
  </div>
</div>

<header>
  <div class="brand">
    <div class="logo">م</div>
    <div>
      <h1>مصيدة الملاك</h1>
      <div class="sub">القاهرة الجديدة فقط • ملاك مباشر (1 إلى 4 إعلانات)</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <div class="sync-badge" id="syncTime">جاري التحديث...</div>
    <button id="visitorBtn" onclick="showVisitors()" style="display:none;background:#1e293b;color:#fff;border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:.78rem;cursor:pointer">سجل الزوار</button>
    <button onclick="lockApp()" style="background:#1e293b;color:#fca5a5;border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:.78rem;cursor:pointer">قفل</button>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="num" id="stTotal">0</div><div class="lbl">إجمالي الملاك</div></div>
  <div class="stat"><div class="num" id="stUnread" style="color:var(--green)">0</div><div class="lbl">لم يفتح بعد</div></div>
  <div class="stat"><div class="num" id="stSale">0</div><div class="lbl">وحدات بيع</div></div>
  <div class="stat"><div class="num" id="stRent" style="color:var(--blue)">0</div><div class="lbl">وحدات إيجار</div></div>
</div>

<div class="filters-panel">
  <input type="text" id="qSearch" placeholder="ابحث بالمنطقة في القاهرة الجديدة (التجمع، اللوتس، النرجس، بيت الوطن...)" oninput="render()">

  <div>
    <div class="filter-group-title">فئة العقار (مطابق لدوبيزل)</div>
    <div class="tabs-row" id="catTabs">
      <button class="tab-btn active" onclick="setCat('الكل',this)">الكل</button>
      <button class="tab-btn" onclick="setCat('شقق للإيجار',this)">شقق للإيجار</button>
      <button class="tab-btn" onclick="setCat('فلل للإيجار',this)">فلل للإيجار</button>
      <button class="tab-btn" onclick="setCat('عقار تجاري للإيجار',this)">عقار تجاري للإيجار</button>
      <button class="tab-btn" onclick="setCat('شقق للبيع',this)">شقق للبيع</button>
      <button class="tab-btn" onclick="setCat('فلل للبيع',this)">فلل للبيع</button>
      <button class="tab-btn" onclick="setCat('عقار تجاري للبيع',this)">عقار تجاري للبيع</button>
    </div>
  </div>

  <div>
    <div class="filter-group-title">النوع (مطابق لدوبيزل)</div>
    <div class="tabs-row" id="subTabs">
      <button class="tab-btn active" onclick="setSub('الكل',this)">كل الأنواع</button>
      <button class="tab-btn" onclick="setSub('شقة',this)">شقة</button>
      <button class="tab-btn" onclick="setSub('دوبلكس',this)">دوبلكس</button>
      <button class="tab-btn" onclick="setSub('بنتهاوس',this)">بنتهاوس</button>
      <button class="tab-btn" onclick="setSub('فيلا',this)">فيلا</button>
      <button class="tab-btn" onclick="setSub('سطح',this)">سطح</button>
      <button class="tab-btn" onclick="setSub('شقة فندقية',this)">شقة فندقية</button>
      <button class="tab-btn" onclick="setSub('ستوديو',this)">ستوديو</button>
      <button class="tab-btn" onclick="setSub('غرفة',this)">غرفة</button>
      <button class="tab-btn" onclick="setSub('عقار تجاري',this)">عقار تجاري</button>
    </div>
  </div>

  <div class="tabs-row" id="stateTabs">
    <button class="tab-btn active" onclick="setState('all',this)">كل الحالات</button>
    <button class="tab-btn" onclick="setState('unopened',this)">لم يفتح بعد</button>
    <button class="tab-btn" onclick="setState('uncontacted',this)">لم يتم التواصل</button>
    <button class="tab-btn" onclick="setState('contacted',this)">تم التواصل</button>
  </div>

  <div class="controls-grid">
    <input type="number" id="maxPrice" placeholder="أقصى سعر (ج.م)" oninput="render()">
    <select id="sortBy" onchange="render()">
      <option value="newest">الترتيب: الأحدث أولا</option>
      <option value="low">السعر: الأقل أولا</option>
      <option value="high">السعر: الأعلى أولا</option>
    </select>
  </div>
</div>

<div id="list" class="grid"></div>

<script>
const ADMIN_PASS = "2738";
const USER_PASS = "3399";
const LOG_TOPIC = "gamal_masyada_visitors_2738_v2";

let ALL_ADS = [];
let curCat = "الكل";
let curSub = "الكل";
let curState = "all";

let openedMap = JSON.parse(localStorage.getItem("gamal_opened_v2") || "{}");
let contactedMap = JSON.parse(localStorage.getItem("gamal_contacted_v2") || "{}");

function getDeviceName(){
  const ua = navigator.userAgent;
  if(/android/i.test(ua)) return "موبايل أندرويد";
  if(/iPhone|iPad/i.test(ua)) return "آيفون / آيباد";
  if(/Windows/i.test(ua)) return "كمبيوتر ويندوز";
  if(/Mac/i.test(ua)) return "ماك";
  return "جهاز متصفح";
}

function applyRoleUI(passUsed){
  const vBtn = document.getElementById("visitorBtn");
  if(passUsed === ADMIN_PASS){
    vBtn.style.display = "inline-block";
  } else {
    vBtn.style.display = "none";
    document.getElementById("visitorModal").style.display = "none";
  }
}

function checkAuth(){
  const savedPass = localStorage.getItem("gamal_auth_pass_v3");
  if(savedPass === ADMIN_PASS || savedPass === USER_PASS){
    document.getElementById("lockScreen").style.display = "none";
    applyRoleUI(savedPass);
  }
}
checkAuth();

async function sendVisitorLog(entry){
  let localLogs = JSON.parse(localStorage.getItem("gamal_visitors_log_v3") || "[]");
  localLogs.unshift(entry);
  localStorage.setItem("gamal_visitors_log_v3", JSON.stringify(localLogs.slice(0, 100)));
  try{
    await fetch("https://ntfy.sh/" + LOG_TOPIC, {
      method: "POST",
      body: JSON.stringify(entry)
    });
  }catch(e){}
}

function unlock(){
  const name = (document.getElementById("vName").value || "بدون اسم").trim();
  const pass = document.getElementById("vPass").value.trim();
  if(pass === ADMIN_PASS || pass === USER_PASS){
    localStorage.setItem("gamal_auth_pass_v3", pass);
    localStorage.setItem("gamal_auth_name_v3", name);
    const entry = {
      id: Date.now() + "_" + Math.random().toString(36).slice(2,6),
      name: name,
      device: getDeviceName(),
      role: pass === ADMIN_PASS ? "أدمن (2738)" : "مستخدم (3399)",
      time: new Date().toLocaleString("ar-EG")
    };
    sendVisitorLog(entry);
    applyRoleUI(pass);
    document.getElementById("lockScreen").style.display = "none";
  } else {
    document.getElementById("errMsg").style.display = "block";
  }
}

function lockApp(){
  localStorage.removeItem("gamal_auth_pass_v3");
  location.reload();
}

async function showVisitors(){
  if(localStorage.getItem("gamal_auth_pass_v3") !== ADMIN_PASS) return;
  const box = document.getElementById("visitorList");
  box.innerHTML = "<div>جاري تحميل سجل الزوار من جميع الأجهزة...</div>";
  document.getElementById("visitorModal").style.display = "flex";

  let mergedMap = {};
  let localLogs = JSON.parse(localStorage.getItem("gamal_visitors_log_v3") || "[]");
  for(const l of localLogs){
    if(l && l.id) mergedMap[l.id] = l;
  }

  try{
    const res = await fetch("https://ntfy.sh/" + LOG_TOPIC + "/json?poll=1&since=all", {cache: "no-store"});
    if(res.ok){
      const txt = await res.text();
      const lines = txt.trim().split("\n");
      for(const line of lines){
        if(!line) continue;
        try{
          const pkt = JSON.parse(line);
          if(pkt && pkt.message){
            const entry = JSON.parse(pkt.message);
            if(entry && entry.id){
              mergedMap[entry.id] = entry;
            }
          }
        }catch(e){}
      }
    }
  }catch(e){}

  const allLogs = Object.values(mergedMap).sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  localStorage.setItem("gamal_visitors_log_v3", JSON.stringify(allLogs.slice(0, 150)));

  if(!allLogs.length){
    box.innerHTML = "<div>لا توجد تسجيلات دخول بعد.</div>";
  } else {
    box.innerHTML = allLogs.map((l,i)=>`
      <div style="background:#0f172a;padding:10px;border-radius:8px;border:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b>${i+1}. ${l.name}</b>
          <span style="font-size:.75rem;padding:2px 8px;border-radius:6px;background:${String(l.role).includes('أدمن')?'#065f46':'#1e3a8a'};color:#fff">${l.role || 'مستخدم'}</span>
        </div>
        <div style="color:var(--muted);font-size:.8rem;margin-top:4px">${l.device} • ${l.time}</div>
      </div>
    `).join("");
  }
}

const STRICT_FORBIDDEN = [
  "مصر الجديدة","مصر الجديده","مدينة نصر","مدينه نصر","زهراء مدينة نصر",
  "الكوربة","أرض الجولف","ارض الجولف","ميدان الحجاز","روكسي","الماظة","ألماظة",
  "شيراتون","النزهة","عباس العقاد","مكرم عبيد","مصطفى النحاس"
];

function isCleanAd(ad){
  const text = ((ad.title||"") + " " + (ad.description||"")).toLowerCase();
  for(const bad of STRICT_FORBIDDEN){
    if(text.includes(bad)) return false;
  }
  const cnt = Number(ad.seller_ads_count || 1);
  return cnt >= 1 && cnt <= 4;
}

function extractPhone(text){
  if(!text) return null;
  const s = text.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  const m = s.match(/(?:\+?20|0)?(1[0125]\d{8})\b/);
  return m ? "20" + m[1] : null;
}

function setCat(c, btn){
  curCat = c;
  document.querySelectorAll("#catTabs .tab-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function setSub(s, btn){
  curSub = s;
  document.querySelectorAll("#subTabs .tab-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function setState(st, btn){
  curState = st;
  document.querySelectorAll("#stateTabs .tab-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function markOpened(id){
  openedMap[id] = (openedMap[id] || 0) + 1;
  localStorage.setItem("gamal_opened_v2", JSON.stringify(openedMap));
  render();
}

function toggleContacted(id){
  if(contactedMap[id]) delete contactedMap[id];
  else contactedMap[id] = true;
  localStorage.setItem("gamal_contacted_v2", JSON.stringify(contactedMap));
  render();
}

function render(){
  const q = (document.getElementById("qSearch").value || "").trim().toLowerCase();
  const maxP = Number(document.getElementById("maxPrice").value || 0);
  const sort = document.getElementById("sortBy").value;

  const cleanAds = ALL_ADS.filter(isCleanAd);
  document.getElementById("stTotal").textContent = cleanAds.length;
  document.getElementById("stUnread").textContent = cleanAds.filter(a=>!openedMap[a.ad_id]).length;
  document.getElementById("stSale").textContent = cleanAds.filter(a=>a.deal==="بيع").length;
  document.getElementById("stRent").textContent = cleanAds.filter(a=>a.deal==="إيجار").length;

  let filtered = cleanAds.filter(a=>{
    if(curCat !== "الكل" && a.category !== curCat) return false;
    if(curSub !== "الكل" && a.subtype !== curSub) return false;
    if(curState === "unopened" && openedMap[a.ad_id]) return false;
    if(curState === "uncontacted" && contactedMap[a.ad_id]) return false;
    if(curState === "contacted" && !contactedMap[a.ad_id]) return false;
    if(maxP > 0 && a.price_num > 0 && a.price_num > maxP) return false;
    if(q){
      const hay = ((a.title||"")+" "+(a.description||"")+" "+(a.seller_name||"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(sort === "low") filtered.sort((a,b)=>(a.price_num||999999999)-(b.price_num||999999999));
  else if(sort === "high") filtered.sort((a,b)=>(b.price_num||0)-(a.price_num||0));
  else filtered.sort((a,b)=>(b.ad_id||0)-(a.ad_id||0));

  const box = document.getElementById("list");
  if(!filtered.length){
    box.innerHTML = `<div class="empty">لا توجد إعلانات مطابقة للفلتر المحدد حاليا.</div>`;
    return;
  }

  box.innerHTML = filtered.map(a=>{
    const views = openedMap[a.ad_id] || 0;
    const isCont = !!contactedMap[a.ad_id];
    const waPhone = extractPhone((a.title||"") + " " + (a.description||""));
    const catLabel = a.category || (a.deal==="إيجار" ? "شقق للإيجار" : "شقق للبيع");
    const subLabel = a.subtype || "شقة";

    return `
    <div class="card ${views?'opened':''} ${isCont?'contacted':''}">
      <div>
        <div class="badges">
          <span class="b-cat">${catLabel}</span>
          <span class="b-sub">${subLabel}</span>
          <span class="b-own">المالك (${a.seller_ads_count||1} إعلان)</span>
          <span class="b-state ${views?'done':''}">${views ? 'تم الفتح ('+views+')' : 'لم يفتح بعد'}</span>
        </div>
        <div class="price" style="margin-top:10px">${a.price_text || 'مدرج بالإعلان'}</div>
        <div class="title" style="margin-top:6px">${a.title}</div>
        <div class="specs" style="margin-top:10px">
          <span>المساحة: ${a.area||'مدرج'}</span>
          ${a.beds ? `<span>• ${a.beds}</span>` : ''}
          ${a.baths ? `<span>• ${a.baths}</span>` : ''}
        </div>
        <div class="desc" style="margin-top:10px">${a.description || a.title}</div>
      </div>
      <div>
        <div class="seller" style="margin-bottom:10px">
          <span>الناشر: <b>${a.seller_name||'المالك'}</b></span>
          <span>#${a.ad_id}</span>
        </div>
        <div class="actions">
          <a class="btn btn-open" href="${a.url}" target="_blank" rel="noopener" onclick="markOpened(${a.ad_id})">فتح إعلان دوبيزل</a>
          ${waPhone
            ? `<a class="btn btn-wa" href="https://wa.me/${waPhone}" target="_blank" rel="noopener" onclick="markOpened(${a.ad_id})">واتساب مباشر</a>`
            : `<a class="btn btn-wa" style="background:#334155;color:#cbd5e1" href="${a.url}" target="_blank" rel="noopener" onclick="markOpened(${a.ad_id})">الرقم داخل الإعلان</a>`
          }
          <button class="btn btn-contact-toggle ${isCont?'active':''}" onclick="toggleContacted(${a.ad_id})">
            ${isCont ? 'تم التواصل مع المالك (اضغط للإلغاء)' : 'تحديد كـ: لم يتم التواصل'}
          </button>
        </div>
      </div>
    </div>`;
  }).join("");
}

async function fetchLiveJson(){
  const urls = [
    'https://api.github.com/repos/gamallove217-glitch/dubizzle-from-gamal/contents/ads.json?t=' + Date.now(),
    'https://raw.githubusercontent.com/gamallove217-glitch/dubizzle-from-gamal/main/ads.json?t=' + Date.now(),
    'ads.json?t=' + Date.now()
  ];
  for(const u of urls){
    try{
      const headers = u.includes('api.github.com') ? {'Accept': 'application/vnd.github.v3.raw'} : {};
      const r = await fetch(u, {headers, cache: 'no-store'});
      if(r.ok){
        const d = await r.json();
        if(d && Array.isArray(d.ads)) return d;
      }
    }catch(e){}
  }
  return null;
}

async function load(){
  const data = await fetchLiveJson();
  if(data){
    ALL_ADS = data.ads || [];
    document.getElementById("syncTime").textContent = "آخر تحديث للبيانات: " + (data.last_scrape || "الآن");
    render();
  }
}
load();
setInterval(load, 45000);
</script>
