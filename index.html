<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>مصيدة الملاك VIP | لوحة تحكم</title>
<style>
:root{
  --bg:#0a0e1a; --card:#131a2e; --card2:#1a2240;
  --border:rgba(212,175,55,.15); --border-hov:rgba(212,175,55,.4);
  --gold:#d4af37; --gold-l:#f3e5ab; --gold-d:#aa7c11;
  --emerald:#10b981; --blue:#3b82f6; --red:#ef4444;
  --text:#f8fafc; --muted:#94a3b8; --dim:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:12px;max-width:1400px;margin:0 auto}
svg{width:20px;height:20px;flex-shrink:0}

#lockScreen{position:fixed;inset:0;background:radial-gradient(circle at center,#0f172a 0%,#040710 100%);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:var(--card);border:1px solid var(--border-hov);border-radius:20px;padding:30px 24px;width:100%;max-width:380px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.8)}
.lock-box::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-l),var(--gold),var(--gold-d))}
.lock-crest{width:56px;height:56px;margin:0 auto 14px;border-radius:14px;background:linear-gradient(135deg,var(--gold-l),var(--gold),var(--gold-d));color:#050811;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(212,175,55,.3)}
.lock-crest svg{width:30px;height:30px}
.lock-box h2{background:linear-gradient(135deg,var(--gold-l),var(--gold-d));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:1.5rem;font-weight:800;margin-bottom:4px}
.lock-box p{color:var(--muted);font-size:.85rem;margin-bottom:18px}
.lock-input-wrap{margin-bottom:12px}
.lock-input-wrap input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(6,9,19,.85);color:#fff;text-align:center;font-size:1rem;font-weight:700;transition:.25s}
.lock-input-wrap input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 15px rgba(212,175,55,.2)}
.lock-btn{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold-l),var(--gold),var(--gold-d));color:#050811;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 8px 20px rgba(212,175,55,.3);transition:.2s}
.lock-btn:active{transform:scale(.98)}
.err-msg{color:var(--red);font-size:.82rem;font-weight:700;margin-top:10px;display:none}

header{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;top:0;right:0;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.brand{display:flex;align-items:center;gap:12px}
.logo-badge{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--gold-l),var(--gold),var(--gold-d));color:#050811;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(212,175,55,.3)}
.logo-badge svg{width:26px;height:26px}
.brand-text h1{font-size:1.3rem;font-weight:800}
.brand-text p{font-size:.78rem;color:var(--muted)}
.header-stats{display:flex;gap:8px;flex-wrap:wrap}
.stat-pill{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700}
.stat-pill .v{color:var(--gold);font-size:1rem}
.stat-pill .l{color:var(--muted);font-size:.72rem}
.icon-btn{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--muted);transition:.2s;position:relative}
.icon-btn:hover{border-color:var(--border-hov);color:var(--gold)}
.badge{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;border-radius:8px;font-size:.65rem;font-weight:800;padding:1px 5px;min-width:16px;text-align:center}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:"";position:absolute;top:0;right:0;width:60px;height:60px;background:radial-gradient(circle,rgba(212,175,55,.08),transparent)}
.stat-card .icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.stat-card .icon.gold{background:rgba(212,175,55,.15);color:var(--gold)}
.stat-card .icon.emerald{background:rgba(16,185,129,.15);color:var(--emerald)}
.stat-card .icon.blue{background:rgba(59,130,246,.15);color:var(--blue)}
.stat-card .icon.red{background:rgba(239,68,68,.15);color:var(--red)}
.stat-card .num{font-size:1.8rem;font-weight:800;line-height:1}
.stat-card .lbl{font-size:.78rem;color:var(--muted);margin-top:4px}
.stat-card .sub{font-size:.7rem;color:var(--dim);margin-top:2px}

.search-bar{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;gap:10px;align-items:center;transition:.2s}
.search-bar:focus-within{border-color:var(--border-hov);box-shadow:0 0 15px rgba(212,175,55,.1)}
.search-bar svg{color:var(--muted);flex-shrink:0}
.search-bar input{flex:1;background:transparent;border:none;color:var(--text);font-size:1rem;font-weight:600;outline:none}
.search-bar input::placeholder{color:var(--dim)}

.filters-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters-row:last-child{margin-bottom:0}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.filter-select{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;outline:none;transition:.2s;min-width:120px}
.filter-select:focus{border-color:var(--border-hov)}
.filter-select option{background:var(--card2)}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:.8rem;font-weight:600;cursor:pointer;transition:.2s;color:var(--muted)}
.chip:hover{border-color:var(--border-hov);color:var(--text)}
.chip.active{background:linear-gradient(135deg,var(--gold-l),var(--gold),var(--gold-d));color:#050811;border-color:transparent;font-weight:800}
.filter-reset{background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted);transition:.2s}
.filter-reset:hover{border-color:var(--red);color:var(--red)}

.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.sort-bar .count{font-size:.85rem;color:var(--muted);font-weight:600}
.sort-bar .count span{color:var(--gold);font-weight:800;font-size:1rem}
.sort-select{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;outline:none}

.ads-list{display:flex;flex-direction:column;gap:10px}
.ad-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;transition:.25s;position:relative;overflow:hidden;cursor:pointer}
.ad-card:hover{border-color:var(--border-hov);transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.ad-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--source-color,var(--gold))}
.ad-top{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:10px}
.ad-title{font-size:1.05rem;font-weight:700;flex:1;line-height:1.4}
.ad-badges{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.badge-tag{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.badge-tag.source-dubizzle{background:rgba(59,130,246,.15);color:#60a5fa}
.badge-tag.source-aqarmap{background:rgba(16,185,129,.15);color:#34d399}
.badge-tag.source-opensooq{background:rgba(212,175,55,.15);color:var(--gold)}
.badge-tag.fresh{background:rgba(239,68,68,.15);color:var(--red)}
.badge-tag.tier3{background:rgba(16,185,129,.2);color:var(--emerald)}
.badge-tag.tier2{background:rgba(59,130,246,.15);color:#60a5fa}
.badge-tag.tier1{background:rgba(148,163,184,.15);color:var(--muted)}
.ad-price{font-size:1.3rem;font-weight:800;color:var(--gold);margin-bottom:8px}
.ad-details{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:.82rem;color:var(--muted)}
.ad-details span{display:flex;align-items:center;gap:4px}
.ad-desc{font-size:.82rem;color:var(--muted);line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--border)}
.ad-seller{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--text)}
.ad-seller .dot{width:8px;height:8px;border-radius:50%;background:var(--emerald)}
.ad-seller .ads-count{color:var(--muted);font-size:.72rem}
.ad-link{font-size:.75rem;color:var(--blue);text-decoration:none;display:flex;align-items:center;gap:4px;transition:.2s}
.ad-link:hover{color:#93c5fd}

#notifPanel{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:9998;display:none;align-items:center;justify-content:center;padding:20px}
#notifPanel.show{display:flex}
.notif-box{background:var(--card);border:1px solid var(--border-hov);border-radius:18px;width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.8)}
.notif-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.notif-header h3{font-size:1.1rem;font-weight:800}
.notif-close{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:1.2rem;font-weight:700;transition:.2s}
.notif-close:hover{border-color:var(--red);color:var(--red)}
.notif-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.notif-item{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;transition:.2s}
.notif-item:hover{border-color:var(--border-hov)}
.notif-item .time{font-size:.7rem;color:var(--dim);margin-bottom:4px}
.notif-item .msg{font-size:.85rem;line-height:1.4}
.notif-item .msg strong{color:var(--gold)}
.notif-empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:.85rem}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state svg{width:48px;height:48px;margin-bottom:16px;opacity:.3}
.empty-state p{font-size:.9rem}

@media(max-width:640px){
  body{padding:8px}
  .header-stats{display:none}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .filter-select{min-width:100px}
  .ad-price{font-size:1.1rem}
}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-crest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
    <h2>مصيدة الملاك VIP</h2>
    <p>منظومة رصد الملاك المباشرين بالقاهرة الجديدة</p>
    <div class="lock-input-wrap"><input type="text" id="vName" placeholder="الاسم بالكامل"></div>
    <div class="lock-input-wrap"><input type="password" id="vPass" placeholder="كود المرور السري"></div>
    <button class="lock-btn" onclick="unlock()">تسجيل الدخول للمنظومة</button>
    <div class="err-msg" id="errMsg">كود المرور غير صحيح</div>
  </div>
</div>

<div id="notifPanel" onclick="if(event.target===this)closeNotif()">
  <div class="notif-box">
    <div class="notif-header">
      <h3>🔔 الإشعارات</h3>
      <button class="notif-close" onclick="closeNotif()">✕</button>
    </div>
    <div class="notif-list" id="notifList"></div>
  </div>
</div>

<header>
  <div class="brand">
    <div class="logo-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
    <div class="brand-text">
      <h1>مصيدة الملاك VIP</h1>
      <p>لوحة تحكم — رصد الملاك المباشرين</p>
    </div>
  </div>
  <div class="header-stats" id="headerStats"></div>
  <div style="display:flex;gap:8px">
    <button class="icon-btn" onclick="toggleNotif()" title="الإشعارات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge" id="notifBadge" style="display:none">0</span>
    </button>
    <button class="icon-btn" onclick="lockApp()" title="قفل">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </button>
  </div>
</header>

<div class="stats-grid" id="statsGrid"></div>

<div class="search-bar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
  <input type="text" id="searchInput" placeholder="ابحث بعنوان الإعلان أو المالك أو المنطقة..." oninput="filterAds()">
</div>

<div class="filters-panel">
  <div class="filters-row">
    <div class="filter-group">
      <label>المصدر</label>
      <div class="filter-chips" id="sourceChips"></div>
    </div>
  </div>
  <div class="filters-row">
    <div class="filter-group">
      <label>نوع العرض</label>
      <div class="filter-chips" id="dealChips"></div>
    </div>
    <div class="filter-group">
      <label>الفئة</label>
      <select class="filter-select" id="categoryFilter" onchange="filterAds()">
        <option value="">كل الفئات</option>
      </select>
    </div>
    <div class="filter-group">
      <label>النوع</label>
      <select class="filter-select" id="subtypeFilter" onchange="filterAds()">
        <option value="">كل الأنواع</option>
      </select>
    </div>
  </div>
  <div class="filters-row">
    <div class="filter-group">
      <label>السعر (ج.م)</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="number" id="priceMin" placeholder="من" style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:.85rem;width:100px;outline:none" oninput="filterAds()">
        <span style="color:var(--dim)">—</span>
        <input type="number" id="priceMax" placeholder="إلى" style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:.85rem;width:100px;outline:none" oninput="filterAds()">
      </div>
    </div>
    <div class="filter-group">
      <label>المساحة (م²)</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="number" id="areaMin" placeholder="من" style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:.85rem;width:80px;outline:none" oninput="filterAds()">
        <span style="color:var(--dim)">—</span>
        <input type="number" id="areaMax" placeholder="إلى" style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:.85rem;width:80px;outline:none" oninput="filterAds()">
      </div>
    </div>
    <div class="filter-group">
      <label>غرف النوم</label>
      <select class="filter-select" id="bedsFilter" onchange="filterAds()">
        <option value="">أي عدد</option>
        <option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option>
      </select>
    </div>
    <div class="filter-group">
      <label>الحداثة</label>
      <div class="filter-chips" id="tierChips"></div>
    </div>
  </div>
  <div class="filters-row">
    <button class="filter-reset" onclick="resetFilters()">↺ مسح كل الفلاتر</button>
  </div>
</div>

<div class="sort-bar">
  <div class="count">عرض <span id="resultCount">0</span> إعلان</div>
  <select class="sort-select" id="sortSelect" onchange="renderAds()">
    <option value="fresh">الأحدث أولاً</option>
    <option value="price-asc">السعر: الأقل للأعلى</option>
    <option value="price-desc">السعر: الأعلى للأقل</option>
    <option value="area-desc">المساحة: الأكبر للأصغر</option>
    <option value="id-desc">أحدث ID</option>
  </select>
</div>

<div class="ads-list" id="adsList"></div>

<script>
const CFG = Object.assign({
  ADMIN_PASS: "2738",
  USER_PASS: "3399",
  MAX_OWNER_ADS: 49,
  REFRESH_MS: 120000
}, window.__CFG || {});
const ADMIN_PASS = CFG.ADMIN_PASS;
const USER_PASS = CFG.USER_PASS;

function unlock(){
  const name = (document.getElementById("vName").value || "بدون اسم").trim();
  const pass = document.getElementById("vPass").value.trim();
  if(pass === ADMIN_PASS || pass === USER_PASS){
    localStorage.setItem("gamal_auth_pass_v3", pass);
    localStorage.setItem("gamal_auth_name_v3", name);
    document.getElementById("lockScreen").style.display = "none";
    render();
  } else {
    document.getElementById("errMsg").style.display = "block";
  }
}
function lockApp(){
  localStorage.removeItem("gamal_auth_pass_v3");
  location.reload();
}
function checkAuth(){
  return localStorage.getItem("gamal_auth_pass_v3") === ADMIN_PASS || localStorage.getItem("gamal_auth_pass_v3") === USER_PASS;
}
if(!checkAuth()){
  document.getElementById("lockScreen").style.display = "flex";
} else {
  document.getElementById("lockScreen").style.display = "none";
}

let ALL_ADS = [];
let notifications = [];
let activeFilters = { source: [], deal: [], tier: [] };

function toggleNotif(){
  document.getElementById("notifPanel").classList.toggle("show");
  renderNotifs();
}
function closeNotif(){
  document.getElementById("notifPanel").classList.remove("show");
}
function renderNotifs(){
  const list = document.getElementById("notifList");
  if(notifications.length === 0){
    list.innerHTML = '<div class="notif-empty">لا توجد إشعارات جديدة</div>';
  } else {
    list.innerHTML = notifications.map(n => `
      <div class="notif-item">
        <div class="time">${n.time}</div>
        <div class="msg">${n.msg}</div>
      </div>`).join("");
  }
  const badge = document.getElementById("notifBadge");
  if(notifications.length > 0){
    badge.style.display = "block";
    badge.textContent = notifications.length;
  } else {
    badge.style.display = "none";
  }
}
function addNotification(msg){
  const now = new Date();
  const time = now.toLocaleTimeString("ar-EG", {hour: "2-digit", minute: "2-digit"});
  notifications.unshift({ msg, time });
  if(notifications.length > 50) notifications.pop();
  renderNotifs();
}

function setupFilters(){
  const sources = [
    { key: "دوبيزل", label: "دوبيزل" },
    { key: "عقارماب", label: "عقارماب" },
    { key: "السوق المفتوح", label: "السوق المفتوح" }
  ];
  document.getElementById("sourceChips").innerHTML = sources.map(s =>
    `<div class="chip" data-filter="source" data-val="${s.key}" onclick="toggleChip(this,'source')">${s.label}</div>`
  ).join("");

  document.getElementById("dealChips").innerHTML = [
    { key: "بيع", label: "للبيع" },
    { key: "إيجار", label: "للإيجار" }
  ].map(d =>
    `<div class="chip" data-filter="deal" data-val="${d.key}" onclick="toggleChip(this,'deal')">${d.label}</div>`
  ).join("");

  document.getElementById("tierChips").innerHTML = [
    { key: "3", label: "اليوم" },
    { key: "2", label: "أمس" },
    { key: "1", label: "هذا الأسبوع" }
  ].map(t =>
    `<div class="chip" data-filter="tier" data-val="${t.key}" onclick="toggleChip(this,'tier')">${t.label}</div>`
  ).join("");

  const cats = [...new Set(ALL_ADS.map(a => a.category).filter(Boolean))].sort();
  document.getElementById("categoryFilter").innerHTML = '<option value="">كل الفئات</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join("");

  const subs = [...new Set(ALL_ADS.map(a => a.subtype).filter(Boolean))].sort();
  document.getElementById("subtypeFilter").innerHTML = '<option value="">كل الأنواع</option>' + subs.map(s => `<option value="${s}">${s}</option>`).join("");
}

function toggleChip(el, filterType){
  const val = el.dataset.val;
  el.classList.toggle("active");
  if(activeFilters[filterType].includes(val)){
    activeFilters[filterType] = activeFilters[filterType].filter(v => v !== val);
  } else {
    activeFilters[filterType].push(val);
  }
  filterAds();
}

function resetFilters(){
  document.querySelectorAll(".chip.active").forEach(c => c.classList.remove("active"));
  activeFilters = { source: [], deal: [], tier: [] };
  document.getElementById("categoryFilter").value = "";
  document.getElementById("subtypeFilter").value = "";
  document.getElementById("priceMin").value = "";
  document.getElementById("priceMax").value = "";
  document.getElementById("areaMin").value = "";
  document.getElementById("areaMax").value = "";
  document.getElementById("bedsFilter").value = "";
  document.getElementById("searchInput").value = "";
  filterAds();
}

function filterAds(){
  renderAds();
}

function renderAds(){
  const search = document.getElementById("searchInput").value.toLowerCase().trim();
  const cat = document.getElementById("categoryFilter").value;
  const sub = document.getElementById("subtypeFilter").value;
  const pMin = parseInt(document.getElementById("priceMin").value) || 0;
  const pMax = parseInt(document.getElementById("priceMax").value) || 0;
  const aMin = parseInt(document.getElementById("areaMin").value) || 0;
  const aMax = parseInt(document.getElementById("areaMax").value) || 0;
  const beds = parseInt(document.getElementById("bedsFilter").value) || 0;
  const sort = document.getElementById("sortSelect").value;

  let filtered = ALL_ADS.filter(a => {
    if(activeFilters.source.length > 0 && !activeFilters.source.includes(a.source)) return false;
    if(activeFilters.deal.length > 0 && !activeFilters.deal.includes(a.deal)) return false;
    if(activeFilters.tier.length > 0 && !activeFilters.tier.includes(String(a.fresh_tier))) return false;
    if(cat && a.category !== cat) return false;
    if(sub && a.subtype !== sub) return false;
    const price = a.price_num || 0;
    if(price < pMin || (pMax > 0 && price > pMax)) return false;
    const area = parseInt(a.area) || 0;
    if(area < aMin || (aMax > 0 && area > aMax)) return false;
    if(beds > 0) {
      const bedMatch = (a.beds || "").match(/\d+/);
      const bedNum = bedMatch ? parseInt(bedMatch[0]) : 0;
      if(bedNum < beds) return false;
    }
    if(search) {
      const searchText = (a.title + " " + a.description + " " + a.seller_name + " " + a.area + " " + a.category).toLowerCase();
      if(!searchText.includes(search)) return false;
    }
    return true;
  });

  if(sort === "price-asc") filtered.sort((a, b) => (a.price_num||0) - (b.price_num||0));
  else if(sort === "price-desc") filtered.sort((a, b) => (b.price_num||0) - (a.price_num||0));
  else if(sort === "area-desc") filtered.sort((a, b) => parseInt(b.area||0) - parseInt(a.area||0));
  else if(sort === "id-desc") filtered.sort((a, b) => (b.ad_id||0) - (a.ad_id||0));
  else filtered.sort((a, b) => (b.fresh_tier||0) - (a.fresh_tier||0));

  document.getElementById("resultCount").textContent = filtered.length;

  const list = document.getElementById("adsList");
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <p>لا توجد إعلانات مطابقة للفلاتر</p>
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(a => {
    const sourceColor = a.source === "دوبيزل" ? "#3b82f6" : a.source === "عقارماب" ? "#10b981" : "#d4af37";
    const tierLabel = a.fresh_tier === 3 ? "اليوم" : a.fresh_tier === 2 ? "أمس" : "هذا الأسبوع";
    const tierClass = a.fresh_tier === 3 ? "tier3" : a.fresh_tier === 2 ? "tier2" : "tier1";
    const srcClass = a.source === "دوبيزل" ? "source-dubizzle" : a.source === "عقارماب" ? "source-aqarmap" : "source-opensooq";
    const bedsMatch = (a.beds || "").match(/\d+/);
    const areaNum = parseInt(a.area) || 0;
    const isFresh = a.fresh_tier === 3;
    return `
      <div class="ad-card" style="--source-color:${sourceColor}" onclick="window.open('${a.url||'#'}', '_blank')">
        <div class="ad-top">
          <div class="ad-title">${esc(a.title || "إعلان")}</div>
          <div class="ad-badges">
            <span class="badge-tag ${srcClass}">${a.source}</span>
            ${isFresh ? '<span class="badge-tag fresh">★ حديث</span>' : ''}
            <span class="badge-tag ${tierClass}">${tierLabel}</span>
          </div>
        </div>
        <div class="ad-price">${esc(a.price_text || "مدرج بالإعلان")}</div>
        <div class="ad-details">
          ${a.category ? `<span>${esc(a.category)}</span>` : ''}
          ${a.subtype ? `<span>${esc(a.subtype)}</span>` : ''}
          ${a.deal ? `<span>${a.deal === "بيع" ? "للبيع" : "للإيجار"}</span>` : ''}
          ${areaNum > 0 ? `<span>${areaNum} م²</span>` : ''}
          ${bedsMatch ? `<span>${bedsMatch[0]} غرف</span>` : ''}
        </div>
        <div class="ad-desc">${esc(a.description || "")}</div>
        <div class="ad-bottom">
          <div class="ad-seller">
            <span class="dot"></span>
            ${esc(a.seller_name || "المالك")}
            <span class="ads-count">${a.seller_ads_count || 1} إعلان نشط</span>
          </div>
          <a href="${a.url||'#'}" target="_blank" onclick="event.stopPropagation()" class="ad-link">
            فتح الإعلان ↗
          </a>
        </div>
      </div>`;
  }).join("");
}

function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderStats(){
  const dub = ALL_ADS.filter(a => a.source === "دوبيزل").length;
  const aqar = ALL_ADS.filter(a => a.source === "عقارماب").length;
  const os = ALL_ADS.filter(a => a.source === "السوق المفتوح").length;
  const sale = ALL_ADS.filter(a => a.deal === "بيع").length;
  const rent = ALL_ADS.filter(a => a.deal === "إيجار").length;
  const fresh = ALL_ADS.filter(a => a.fresh_tier === 3).length;
  const lastReport = window.__REPORT || {};

  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card">
      <div class="icon gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <div class="num">${ALL_ADS.length}</div>
      <div class="lbl">إعلان مالك مباشر</div>
      <div class="sub">${sale} للبيع · ${rent} للإيجار</div>
    </div>
    <div class="stat-card">
      <div class="icon emerald"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <div class="num">${fresh}</div>
      <div class="lbl">إعلانات اليوم</div>
      <div class="sub">حديثة التحقق</div>
    </div>
    <div class="stat-card">
      <div class="icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
      <div class="num">${dub}</div>
      <div class="lbl">دوبيزل</div>
      <div class="sub">${lastReport.dubizzle_inspected||0} مفحوص</div>
    </div>
    <div class="stat-card">
      <div class="icon red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
      <div class="num">${lastReport.total_brokers_banned_this_run||0}</div>
      <div class="lbl">سماسرة محذوفين</div>
      <div class="sub">من ${lastReport.total_inspected_this_run||0} مفحوص</div>
    </div>
    <div class="stat-card">
      <div class="icon gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></div>
      <div class="num">${aqar}</div>
      <div class="lbl">عقارماب</div>
    </div>
    <div class="stat-card">
      <div class="icon emerald"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
      <div class="num">${os}</div>
      <div class="lbl">السوق المفتوح</div>
    </div>
  `;

  document.getElementById("headerStats").innerHTML = `
    <div class="stat-pill"><span class="v">${ALL_ADS.length}</span><span class="l">إعلان</span></div>
    <div class="stat-pill"><span class="v">${fresh}</span><span class="l">حديث</span></div>
    <div class="stat-pill"><span class="v">${lastReport.total_new_owners_this_run||0}</span><span class="l">جديد</span></div>
  `;
}

function render(){
  renderStats();
  setupFilters();
  renderAds();
  renderNotifs();

  if(notifications.length === 0){
    const lastReport = window.__REPORT || {};
    if(lastReport.total_new_owners_this_run > 0){
      addNotification(`✅ تم إضافة <strong>${lastReport.total_new_owners_this_run}</strong> مالك جديد في الرن الأخير`);
    }
    if(lastReport.total_brokers_banned_this_run > 0){
      addNotification(`🚫 تم حذف <strong>${lastReport.total_brokers_banned_this_run}</strong> سمسار`);
    }
    addNotification(`📊 الرن الأخير: ${lastReport.total_inspected_this_run||0} مفحوص · ${ALL_ADS.length} مالك محفوظ`);
  }
}

async function load(){
  try {
    const resp = await fetch("ads.json");
    const data = await resp.json();
    ALL_ADS = data.ads || [];
    window.__REPORT = data.last_run_report || {};
    const notifiedIds = new Set(data.notified_ids_v1 || []);
    const newAds = ALL_ADS.filter(a => !notifiedIds.has(a.ad_id));
    if(newAds.length > 0 && notifications.length === 0){
      newAds.slice(0, 3).forEach(a => {
        addNotification(`🎉 مالك جديد: ${a.seller_name} — ${a.title}`);
      });
    }
    render();
  } catch(e){
    console.error("Failed to load ads.json:", e);
  }
}

setInterval(() => {
  if(!document.hidden) load();
}, CFG.REFRESH_MS);

if(checkAuth()) load();
</script>
</body>
</html>
